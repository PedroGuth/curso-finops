name: "🐛 Bug ou erro no material"
description: "Encontrou um erro em script, query, policy ou documentação? Reporte aqui!"
labels: ["bug"]
body:
  - type: input
    id: arquivo
    attributes:
      label: Arquivo com erro
      placeholder: "Ex: scripts/migrate-gp2-to-gp3.sh"
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: Descrição do erro
      description: O que está errado?
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      description: Passos para reproduzir o problema
  - type: dropdown
    id: os
    attributes:
      label: Sistema Operacional
      options:
        - macOS
        - Ubuntu/Linux
        - Windows
        - Outro
